# ⊹  WINDOW/WORKSPACE RULES
# ┊ . ˚
# ✧
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$
windowrule {
  name = game-float
  match:content = 3
  float = on
}

windowrule {
  name = hi3-fullscreen-force
  match:class = bh3.exe
  fullscreen = on
}

windowrule {
  name = hsrlauncherfloat
  match:class = moe.launcher.the-honkers-railway-launcher
  float = on
}
windowrule {
  name = zzzlauncherfloat
  match:class = moe.launcher.sleepy-launcher
  float = on
}
windowrule {
  name = gilauncherfloat
  match:class = moe.launcher.an-anime-game-launcher
  float = on
}

windowrule {
  name = hi3launcherfloat
  match:class = moe.launcher.honkers-launcher
  float = on
}
windowrule {
  name = generationsfullscreen
  match:class = steam_app_71340
  fullscreen = on
}
# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}


# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# Hide xwaylandvideobridge
windowrule {
  name = windowrule-3
  opacity = 0.0 override
  no_anim = on
  no_initial_focus = on
  max_size = 1 1
  no_blur = on
  no_focus = on
  match:class = ^(xwaylandvideobridge)$
}

layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0.5
  blur = true
  blur_popups = true
}
